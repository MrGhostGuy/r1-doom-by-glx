<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=240">
<link rel="stylesheet" href="style.css">
<title>DOOM by GLX</title>
</head>
<body>
<canvas id="gameCanvas" width="240" height="282"></canvas>
<div id="dpad-left" class="dpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button>●</button><button data-dir="right">▶</button><button data-dir="down">▼</button></div>
<div id="dpad-right" class="dpad"><button></button><button data-aim="left">◀</button><button data-aim="right">▶</button><button></button></div>
<button id="fire-btn" aria-label="Fire"></button>
<button id="pause-btn" aria-label="Pause" style="position:absolute;left:50%;top:4px;transform:translateX(-50%);width:28px;height:14px;z-index:12;opacity:0.14;background:transparent;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.5);font:8px monospace;border-radius:3px;">II</button>
<script src="app.js"></script>
</body>
</html>
